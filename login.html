<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>SulSafe | Plataforma de Seguranca do Trabalho</title>
<link rel="icon" type="image/png" href="logo1.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- MERCADO PAGO — Substitua TEST-xxx pela sua chave publica quando tiver ACC -->
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#2E7D32;--p2:#1B5E20;--p3:#43A047;--gd:#C9B037;--tx:#1A1A1A;--tx2:#555;--tx3:#999;--bd:#E0E0E0;--bd2:#EEE;--ip:#FAFAFA;--bg:#F4F7F6;--cd:#FFF;--gl:rgba(46,125,50,.3);--sh:0 4px 16px rgba(0,0,0,.06);--err:#D32F2F;--r:14px;--r2:20px;--r3:28px}
body.t-azul{--p:#1565C0;--p2:#0D47A1;--p3:#1E88E5;--gl:rgba(21,101,192,.3)}
body.t-roxo{--p:#7B1FA2;--p2:#4A148C;--p3:#9C27B0;--gl:rgba(123,31,162,.3)}
body.t-vermelho{--p:#C62828;--p2:#B71C1C;--p3:#E53935;--gl:rgba(198,40,40,.3)}
body.t-laranja{--p:#E65100;--p2:#BF360C;--p3:#F57C00;--gl:rgba(230,81,0,.3)}
body.t-escuro{--bg:#0E1410;--tx:#ECF3EE;--tx2:#9CB0A2;--tx3:#6B8072;--bd:#1F2D24;--bd2:#1A251E;--cd:#131A15;--ip:#15201A}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;transition:background .35s,color .35s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--p);border-radius:10px}
h1,h2,h3,.fd{font-family:'Montserrat','Inter',sans-serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;outline:none}
::selection{background:var(--p);color:#fff}
#authWrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .4s}
#authWrap.off{opacity:0;pointer-events:none}
.auth-card{width:420px;max-width:94vw;max-height:94vh;overflow-y:auto;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r3);padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.12);animation:au .4s ease}
@keyframes au{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo-r{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lic{width:42px;height:42px;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--gl);color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.lt{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:var(--p)}
.sub{font-size:13px;color:var(--tx2);margin-bottom:22px;border-left:3px solid var(--gd);padding-left:12px;line-height:1.5}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--ip);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;color:var(--tx);font-size:14px;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--gl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:40px;padding:12px 24px;font-size:14px;transition:all .25s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 20px var(--gl)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--gl)}
.btn-s{background:var(--ip);border:1px solid var(--bd)!important;color:var(--tx)}
.btn-s:hover{border-color:var(--p)!important;color:var(--p)}
.btn-d{background:#D32F2F;color:#fff;box-shadow:0 8px 20px rgba(211,47,47,.3)}
.btn-d:hover{transform:translateY(-2px)}
.btn-g{background:linear-gradient(135deg,var(--gd),#b8902a);color:#1a1a00}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:30px}
.btn-block{width:100%;margin-bottom:10px}
.btn-back{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:13px;cursor:pointer;margin-bottom:16px;transition:.2s;font-weight:500}
.btn-back:hover{color:var(--p);transform:translateX(-3px)}
.divider{display:flex;align-items:center;gap:14px;margin:14px 0;color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.t{display:none}.t.on{display:flex;flex-direction:column;animation:au .35s ease}
.back-site{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:13px;color:var(--tx2);text-decoration:none;transition:.2s;font-weight:500}
.back-site:hover{color:var(--p);transform:translateX(-2px)}
#dash{position:fixed;inset:0;display:none;opacity:0;transition:opacity .3s}
#dash.on{display:flex;opacity:1}
.sidebar{width:260px;background:var(--cd);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width .3s,background .35s}
.sb-hd{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.sb-role{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:12px 18px 4px;width:fit-content}
.sb-role.admin{background:linear-gradient(95deg,#C9B037,#F4D57A);color:#2B1F00}
.sb-role.professor{background:linear-gradient(95deg,var(--p),var(--p2));color:#fff}
.sb-role.aluno{background:rgba(120,130,125,.15);color:var(--tx);border:1px solid var(--bd)}
.sb-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);padding:14px 18px 4px;opacity:.6}
.sb-nav{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--r);color:var(--tx2);font-weight:500;font-size:13px;transition:.2s;border-left:3px solid transparent;cursor:pointer}
.ni i{width:18px;text-align:center;font-size:.95rem;flex-shrink:0}
.ni:hover{background:rgba(46,125,50,.06);color:var(--p);transform:translateX(2px)}
.ni.on{background:linear-gradient(95deg,rgba(46,125,50,.12),rgba(46,125,50,.03));color:var(--p);border-left-color:var(--p);font-weight:700}
.sb-ft{padding:14px 18px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.sb-out{color:var(--tx3);padding:6px 8px;border-radius:8px;transition:.2s;font-size:14px}
.sb-out:hover{color:#D32F2F;background:rgba(211,47,47,.08)}
.main{flex:1;overflow-y:auto;padding:28px 32px;animation:fv .3s ease}
@keyframes fv{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.wc{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.wcs{color:var(--tx2);font-size:13px;margin-bottom:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:28px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:20px;transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--p),var(--gd));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.card:hover{border-color:var(--p);box-shadow:0 16px 36px rgba(46,125,50,.15);transform:translateY(-3px)}
.card:hover::before{transform:scaleX(1)}
.card-ic{width:44px;height:44px;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;color:#fff;box-shadow:0 8px 18px var(--gl)}
.card-t{font-size:14px;font-weight:700;margin-bottom:4px}
.card-d{font-size:12px;color:var(--tx2);line-height:1.5}
.pnl{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:22px;margin-bottom:20px;box-shadow:var(--sh)}
.pnl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.pnl-t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.pnl-t i{color:var(--p)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh)}
.st-v{font-size:26px;font-weight:900;color:var(--p);font-family:'Montserrat',sans-serif;line-height:1}
.st-l{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--bd2);color:var(--tx);vertical-align:middle}
tr:nth-child(odd) td{background:rgba(46,125,50,.02)}
tr:hover td{background:rgba(46,125,50,.06)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bg-ok{background:rgba(46,125,50,.15);color:#2E7D32}
.bg-warn{background:rgba(255,152,0,.15);color:#E65100}
.bg-err{background:rgba(211,47,47,.15);color:#D32F2F}
.bg-info{background:rgba(21,101,192,.15);color:#1565C0}
.prog-w{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:18px;box-shadow:var(--sh)}
.prog-bar{background:rgba(0,0,0,.06);border-radius:40px;height:8px;overflow:hidden}
body.t-escuro .prog-bar{background:rgba(255,255,255,.08)}
.prog-fill{background:linear-gradient(90deg,var(--p),var(--p3));height:100%;border-radius:40px;transition:width .6s ease}
.search{width:100%;background:var(--ip);border:1px solid var(--bd);border-radius:40px;padding:11px 18px;color:var(--tx);font-size:14px;margin-bottom:14px;transition:.2s}
.search:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--gl)}
.mt-c{background:var(--cd);border-left:4px solid var(--p);border-radius:var(--r);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:var(--sh);margin-bottom:10px;transition:.2s}
.mt-c:hover{transform:translateX(3px)}
.mt-topic{font-weight:700;font-size:14px}
.mt-id{font-size:11px;font-family:monospace;background:var(--ip);padding:2px 8px;border-radius:20px;color:var(--tx2);margin-top:3px;display:inline-block}
.nr-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.nr-c{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;transition:.25s;cursor:pointer}
.nr-c:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}
.nr-ic{width:42px;height:42px;border-radius:10px;background:rgba(46,125,50,.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:.2s}
.nr-c:hover .nr-ic{background:var(--p);color:#fff}
.nr-num{font-size:10px;font-weight:800;color:var(--gd);letter-spacing:1px;text-transform:uppercase}
.nr-nm{font-size:13px;font-weight:600;line-height:1.3}
.chat-box{display:flex;flex-direction:column;height:420px}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;background:var(--ip);border-radius:var(--r);margin-bottom:10px}
.chat-m{padding:10px 14px;border-radius:12px;margin-bottom:8px;max-width:85%;font-size:13px;line-height:1.5}
.chat-m.u{background:var(--p);color:#fff;margin-left:auto}
.chat-m.b{background:rgba(46,125,50,.1);color:var(--tx)}
body.t-escuro .chat-m.b{background:rgba(76,175,80,.12)}
.chat-row{display:flex;gap:8px}
.chat-row input{flex:1;padding:11px 16px;border:1px solid var(--bd);border-radius:40px;background:var(--ip);color:var(--tx);font-size:14px}
.chat-row input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--gl)}
.cfg-w{display:flex;gap:18px;flex-wrap:wrap}
.cfg-sb{width:200px;background:var(--cd);border-radius:var(--r2);padding:10px;border:1px solid var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.cfg-tb{padding:9px 12px;border-radius:10px;cursor:pointer;transition:.2s;color:var(--tx2);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.cfg-tb.on,.cfg-tb:hover{background:var(--p);color:#fff}
.cfg-bd{flex:1;background:var(--cd);border-radius:var(--r2);padding:20px;border:1px solid var(--bd);box-shadow:var(--sh);min-width:280px}
.cfg-sc{display:none}.cfg-sc.on{display:block;animation:au .3s ease}
.cfg-grp{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd2)}
.cfg-grp label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.cfg-grp input[type=range]{width:100%;accent-color:var(--p);height:6px}
.cfg-grp select{width:100%;background:var(--ip);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;color:var(--tx);font-size:13px}
.tema-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tema-o{padding:14px 10px;border-radius:var(--r);border:2px solid var(--bd);text-align:center;cursor:pointer;transition:.2s;font-size:11px;font-weight:700}
.tema-o:hover{border-color:var(--p)}
.tema-o.on{border-color:var(--p);box-shadow:0 0 0 3px var(--gl)}
.tema-dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(0,0,0,.1)}
.planos-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:20px}
.plan-c{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:28px 24px;text-align:center;transition:.3s;position:relative;box-shadow:var(--sh)}
.plan-c:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(46,125,50,.15)}
.plan-c.dest{border-color:var(--p);box-shadow:0 0 0 2px var(--p),0 18px 40px rgba(46,125,50,.2)}
.plan-c h3{font-size:20px;font-weight:800}
.plan-c .pst{font-size:12px;color:var(--tx2);margin-top:4px}
.plan-c .pr{font-size:32px;font-weight:900;color:var(--p);margin:16px 0 4px}
.plan-c .pr span{font-size:16px;vertical-align:super}
.plan-c .bl{font-size:12px;color:var(--tx2)}
.plan-c .eco{font-size:12px;font-weight:700;color:#2E7D32;background:rgba(46,125,50,.12);padding:3px 12px;border-radius:20px;display:inline-block;margin:8px 0 12px}
.plan-c ul{list-style:none;padding:0;margin:16px 0 20px;text-align:left}
.plan-c ul li{padding:6px 0;font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:10px}
.plan-c ul li::before{content:'\2713';color:var(--p);font-weight:700}
.plan-c ul li.off{opacity:.4}
.plan-c ul li.off::before{content:'\2715';color:#999}
.badge-plan{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gd),#b8902a);color:#1a1a00;padding:4px 16px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.mdl-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.mdl-bg.on{display:flex}
.mdl{background:var(--cd);border-radius:var(--r2);padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;border-top:5px solid var(--p);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:au .3s ease;position:relative}
.mdl-x{position:absolute;top:10px;right:10px;background:var(--bd);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:.2s}
.mdl-x:hover{background:#D32F2F;color:#fff}
.pay-c{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:24px;text-align:center;box-shadow:var(--sh);position:relative}
.qr-box{background:var(--ip);border-radius:12px;padding:20px;margin:16px 0;text-align:center}
.copy-b{background:var(--ip);padding:12px;border-radius:8px;font-family:monospace;font-size:11px;word-break:break-all;margin:10px 0;position:relative;cursor:pointer;transition:.2s}
.copy-b:hover{background:rgba(46,125,50,.06)}
.warn-b{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border:1px solid #FFB74D;border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13px;color:#E65100;font-weight:600}
.warn-b i{font-size:22px;flex-shrink:0}
body.t-escuro .warn-b{background:rgba(230,81,0,.12);border-color:rgba(230,81,0,.3)}
.tabs{display:flex;border-bottom:2px solid var(--bd);margin-bottom:20px}
.tab-b{background:none;border:none;padding:12px 24px;cursor:pointer;font-weight:600;color:var(--tx2);transition:.2s}
.tab-b.on{color:var(--p);border-bottom:3px solid var(--p)}
.tab-c{display:none}.tab-c.on{display:block}
.god-hd{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 28px;border-radius:var(--r2);margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 10px 28px var(--gl)}
.god-hd h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.god-hd h2 i{color:var(--gd);font-size:24px}
.god-hd p{font-size:13px;opacity:.9;margin-top:4px}
.god-hd::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,.08);border-radius:50%}
.ch-b{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:20px;margin-bottom:20px;box-shadow:var(--sh)}
.ch-b h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ch-b h3 i{color:var(--p)}
.ch-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.notif-popup{position:fixed;top:20px;right:20px;z-index:9000;width:360px;max-width:calc(100vw - 40px);background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:0 20px 50px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .4s cubic-bezier(.2,.9,.4,1.1);overflow:hidden}
.notif-popup.show{transform:translateX(0)}
.notif-popup-hd{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.notif-popup-hd h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.notif-popup-bd{padding:16px}
.notif-popup-bd p{font-size:13px;line-height:1.6;color:var(--tx)}
.notif-popup-ft{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:40px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto;animation:ti .3s ease;max-width:360px}
.toast.ok{background:#2E7D32}.toast.err{background:#D32F2F}.toast.warn{background:#E65100}.toast.info{background:#1565C0}
@keyframes ti{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.empty{text-align:center;padding:50px 20px;color:var(--tx3)}
.empty i{font-size:42px;color:var(--gd);margin-bottom:12px;display:block;opacity:.6}
.exame-card{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r2);padding:22px;margin-bottom:16px;box-shadow:var(--sh);transition:.2s}
.exame-card:hover{border-color:var(--p);box-shadow:0 8px 24px rgba(46,125,50,.12)}
.exame-status{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.exame-q{margin-bottom:16px;padding:14px;background:var(--ip);border-radius:var(--r);border:1px solid var(--bd2)}
.exame-q p{font-size:14px;color:var(--tx);line-height:1.7;margin-bottom:10px}
.exame-opts{display:flex;flex-direction:column;gap:8px}
.exame-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--ip);border:1px solid var(--bd2);border-radius:10px;cursor:pointer;transition:.2s;font-size:13px}
.exame-opt:hover{border-color:var(--p);background:rgba(46,125,50,.06)}
.exame-opt.selected{border-color:var(--p);background:rgba(46,125,50,.1);color:var(--p)}
.exame-opt input[type=radio]{accent-color:var(--p)}
.exame-opt input[type=text]{flex:1;background:transparent;border:none;color:var(--tx);font-size:13px;outline:none}
.material-up{display:flex;flex-direction:column;gap:14px}
.material-up textarea{width:100%;min-height:120px;background:var(--ip);border:1px solid var(--bd);border-radius:var(--r);padding:12px;color:var(--tx);font-size:13px;resize:vertical}
.material-list{display:flex;flex-direction:column;gap:10px}
.material-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:rgba(0,0,0,.02);border-radius:var(--r);border:1px solid var(--bd2);transition:.2s}
body.t-escuro .material-item{background:rgba(255,255,255,.04)}
.material-item:hover{transform:translateX(2px)}
.vid-player{background:#000;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9}
.vid-player iframe{width:100%;height:100%;border:none}
.vid-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:2;cursor:pointer;transition:background .2s}
.vid-overlay:hover{background:rgba(0,0,0,.3)}
.vid-overlay i{font-size:48px;color:rgba(255,255,255,.85)}
.vid-title-bar{position:absolute;bottom:0;left:0;right:0;padding:8px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:12px;font-weight:600;z-index:3;display:flex;justify-content:space-between;align-items:center}
@media(max-width:768px){.sidebar{width:60px;padding:8px 4px}.sidebar .lt,.sidebar .ni span,.sidebar .sb-lbl,.sidebar .sb-name,.sidebar .sb-role{display:none}.sb-role{margin:8px auto;width:32px;padding:4px;justify-content:center}.ni{justify-content:center;padding:10px}.sb-hd{justify-content:center;padding:12px 8px}.main{padding:16px 14px}.cfg-w{flex-direction:column}.cfg-sb{width:100%;flex-direction:row;flex-wrap:wrap}.cfg-tb{flex:1;justify-content:center}.ch-g{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.planos-g{grid-template-columns:1fr}}
@media(max-width:480px){.auth-card{padding:24px 20px}.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.nr-g{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function enviarExame(eid){const e=S.exams.find(x=>x.id===eid);if(!e){toast('Prova nao encontrada','err');return}
