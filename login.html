<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SulSafe | Login</title>
    <meta name="description" content="Acesse sua conta SulSafe e tenha acesso a 38 NRs, videoaulas e certificados.">
    <link rel="icon" type="image/png" href="logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --verde: #2E7D32;
            --verde-escuro: #1B5E20;
            --verde-claro: #43A047;
            --verde-bg: #E8F5E9;
            --verde-bg-2: #F1F8F1;
            --dourado: #C9B037;
            --dourado-escuro: #A8922C;
            --dourado-claro: #E8D77A;
            --texto: #1A1A1A;
            --texto-sec: #555;
            --texto-ter: #777;
            --borda: #E0E0E0;
            --branco: #FFFFFF;
            --sombra-md: 0 12px 28px rgba(0,0,0,.10);
            --radius: 16px;
            --grad-verde: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--texto);
            background: var(--branco);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at top right, var(--verde-bg) 0%, transparent 60%),
                        radial-gradient(ellipse at bottom left, rgba(201,176,55,.08) 0%, transparent 50%),
                        linear-gradient(180deg, #fff 0%, var(--verde-bg-2) 100%);
        }
        .login-wrapper { width: 100%; max-width: 440px; margin: 0 auto; }
        .login-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: var(--sombra-md);
            border: 1px solid var(--borda);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--texto-sec);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--verde-escuro); }
        .login-logo { text-align: center; margin-bottom: 28px; }
        .login-logo .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--verde-escuro);
            letter-spacing: -.5px;
        }
        .login-logo .logo-sub {
            font-size: 10px;
            color: var(--dourado-escuro);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 2px;
        }
        .login-title { font-size: 22px; font-weight: 700; color: var(--texto); margin-bottom: 4px; }
        .login-sub { font-size: 14px; color: var(--texto-sec); margin-bottom: 24px; }
        .fld { margin-bottom: 16px; }
        .fld label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto);
            margin-bottom: 4px;
        }
        .fld input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--borda);
            border-radius: 10px;
            font-size: 14px;
            transition: border-color .2s;
            outline: none;
            font-family: inherit;
            background: #fafafa;
        }
        .fld input:focus {
            border-color: var(--verde);
            background: #fff;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--grad-verde);
            color: #fff;
            box-shadow: 0 4px 14px rgba(46,125,50,.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(46,125,50,.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-outline {
            background: transparent;
            color: var(--verde-escuro);
            border: 2px solid var(--verde);
        }
        .btn-outline:hover { background: var(--verde); color: #fff; }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--texto-ter);
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--borda);
        }
        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--texto-sec);
            text-decoration: none;
            transition: color .2s;
        }
        .forgot-link:hover { color: var(--verde-escuro); }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a2e;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all .3s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0,0,0,.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #e74c3c; }
        .toast.success { background: #2ecc71; }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .login-title { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
        <div class="login-logo">
            <div class="logo-text">SulSafe</div>
            <div class="logo-sub">Segurança do Trabalho</div>
        </div>
        <h1 class="login-title">Acesse sua conta</h1>
        <p class="login-sub">38 NRs, videoaulas e certificados digitais</p>

        <form id="frmLogin">
            <div class="fld">
                <label>Email</label>
                <input type="email" id="lEmail" placeholder="seu@email.com" value="sulsafetreinamentos@gmail.com" required autocomplete="email">
            </div>
            <div class="fld">
                <label>Senha</label>
                <input type="password" id="lPass" placeholder="Sua senha" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="divider">ou</div>
        <a href="cadastro.html" class="btn btn-outline"><i class="fas fa-user-plus"></i> Criar nova conta</a>
        <a href="#" class="forgot-link" id="forgotPassword"><i class="fas fa-key"></i> Esqueceu a senha?</a>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ============================================================
    // SUPABASE CONFIG - NUNCA USA 'const' PARA EVITAR ERRO
    // ============================================================
    console.log('🚀 Iniciando página de login...');

    // Configurações fixas
    var SUPABASE_URL = 'https://dhhvhiyoxadcwsfqlndw.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoaHZoaXlveGFkY3dzZnFsbmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTQ0NzIsImV4cCI6MjA5NjQ5MDQ3Mn0.3-We2KnsGekUMrDrG3F0qrP1ZCSwkG6sXcDUQ-ajuAQ';

    // USAR window.supabase PARA EVITAR REDECLARAÇÃO
    if (typeof window.supabaseClient === 'undefined') {
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Novo cliente Supabase criado');
    } else {
        console.log('✅ Reutilizando cliente Supabase existente');
    }

    // Usar o cliente via window
    var supabase = window.supabaseClient;

    // ============================================================
    // FUNÇÃO TOAST
    // ============================================================
    function showToast(msg, type = '') {
        console.log('📢 Toast:', msg, type);
        var toast = document.getElementById('toast');
        if (!toast) {
            alert(msg);
            return;
        }
        toast.textContent = msg;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(function() {
            toast.className = 'toast';
        }, 5000);
    }

    // ============================================================
    // FUNÇÃO DE LOGIN
    // ============================================================
    async function fazerLogin(email, password) {
        console.log('🔍 Tentando login para:', email);
        
        try {
            console.log('📤 Enviando requisição para Supabase...');
            
            var resultado = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            var data = resultado.data;
            var error = resultado.error;

            console.log('📥 Resposta recebida:');
            console.log('  - data:', data);
            console.log('  - error:', error);

            if (error) {
                console.error('❌ Erro de autenticação:', error.message);
                showToast('❌ ' + error.message, 'error');
                return false;
            }

            if (data && data.user) {
                console.log('✅ Login bem-sucedido!');
                console.log('  - User ID:', data.user.id);
                console.log('  - Email:', data.user.email);
                
                localStorage.setItem('user_id', data.user.id);
                localStorage.setItem('user_email', data.user.email);
                localStorage.setItem('user_logged_in', 'true');
                
                showToast('✅ Login realizado com sucesso!', 'success');
                
                console.log('🔄 Redirecionando para dashboard.html...');
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
                return true;
            }

            console.warn('⚠️ Nenhum usuário retornado');
            showToast('❌ Erro desconhecido. Tente novamente.', 'error');
            return false;

        } catch (err) {
            console.error('💥 Erro inesperado:', err);
            showToast('❌ Erro ao fazer login. Tente novamente.', 'error');
            return false;
        }
    }

    // ============================================================
    // EVENTO DO FORMULÁRIO
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 DOM carregado, configurando eventos...');
        
        var form = document.getElementById('frmLogin');
        var emailInput = document.getElementById('lEmail');
        var passInput = document.getElementById('lPass');
        var btn = document.getElementById('btnLogin');

        if (!form) {
            console.error('❌ Formulário não encontrado!');
            return;
        }

        console.log('✅ Formulário encontrado, adicionando evento submit...');

        form.addEventListener('submit', async function(e) {
            console.log('🔄 Evento submit capturado!');
            e.preventDefault();
            
            var email = emailInput.value.trim();
            var password = passInput.value;
            
            console.log('📝 Email:', email);
            console.log('📝 Password:', password ? '***' : '(vazio)');

            if (!email || !password) {
                showToast('Preencha todos os campos', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

            await fazerLogin(email, password);

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
        });

        console.log('✅ Evento submit configurado com sucesso!');
    });

    // ============================================================
    // VERIFICAR SESSÃO EXISTENTE
    // ============================================================
    (async function checkSession() {
        try {
            console.log('🔍 Verificando sessão existente...');
            var resultado = await supabase.auth.getSession();
            var session = resultado.data.session;
            if (session) {
                console.log('✅ Sessão ativa encontrada!');
                console.log('🔄 Redirecionando para dashboard...');
                window.location.href = 'dashboard.html';
            } else {
                console.log('🔐 Nenhuma sessão ativa');
            }
        } catch (e) {
            console.log('⚠️ Erro ao verificar sessão:', e);
        }
    })();

    console.log('🔐 Página de login carregada!');
</script>

</body>
</html>
