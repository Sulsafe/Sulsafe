<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<meta name="description" content="SulSafe — Plataforma de ensino de Segurança do Trabalho com 38 NRs.">
<title>SulSafe | Plataforma de Segurança do Trabalho</title>
<link rel="icon" type="image/png" href="logo1.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
/* ============================================================
   CSS COMPLETO - SULSAFE
   ============================================================ */
:root {
    --p: #2E7D32;
    --p2: #43A047;
    --p3: #1B5E20;
    --gold: #C9B037;
    --bg: #f4f7f6;
    --tx: #1a1a1a;
    --tx2: #4a4a4a;
    --tx3: #888;
    --bd: #dce3e0;
    --bd2: #e8eeec;
    --ip: #f8fafa;
    --r: 12px;
    --sb: #0f1a12;
    --sb2: #1a2b1e;
    --sb-tx: #c8e0c8;
    --card-bg: #fff;
    --shadow: 0 8px 32px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--tx); line-height: 1.5; }
input, select, textarea { font-family: inherit; outline: none; }
a { color: var(--p); text-decoration: none; }

/* Temas */
body.t-azul { --p: #1565C0; --p2: #1E88E5; --p3: #0D47A1; --sb: #0a1628; --sb2: #142a4a; }
body.t-roxo { --p: #7B1FA2; --p2: #9C27B0; --p3: #4A148C; --sb: #1a0a2a; --sb2: #2a1a3a; }
body.t-vermelho { --p: #C62828; --p2: #E53935; --p3: #B71C1C; --sb: #2a0a0a; --sb2: #3a1a1a; }
body.t-laranja { --p: #E65100; --p2: #F57C00; --p3: #BF360C; --sb: #2a1200; --sb2: #3a1a0a; }
body.t-escuro { --p: #66BB6A; --p2: #81C784; --p3: #388E3C; --bg: #121212; --tx: #eee; --tx2: #bbb; --tx3: #777; --bd: #333; --bd2: #2a2a2a; --ip: #1e1e1e; --card-bg: #1e1e1e; --shadow: 0 8px 32px rgba(0,0,0,.3); --sb: #0a0a0a; --sb2: #1a1a1a; --sb-tx: #a0c8a0; }

/* AUTH */
#authWrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: var(--bg); transition: opacity .5s, transform .5s; }
#authWrap.off { opacity: 0; transform: scale(.95); pointer-events: none; position: fixed; width: 100%; }
.auth-card { background: var(--card-bg); border-radius: 24px; padding: 40px 36px; max-width: 440px; width: 100%; box-shadow: var(--shadow); position: relative; }
.auth-card .t { display: none; }
.auth-card .t.on { display: block; animation: fv .3s ease; }
.back-to-site { display: inline-block; font-size: 13px; color: var(--tx3); margin-bottom: 20px; }
.back-to-site i { margin-right: 6px; }
.logo-r { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.lic { width: 48px; height: 48px; background: var(--p); color: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
.lt { font-size: 22px; font-weight: 800; color: var(--p); }
.sub { font-size: 14px; color: var(--tx2); margin-bottom: 24px; }
.fld { margin-bottom: 16px; }
.fld label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--tx2); }
.fld input, .fld select, .fld textarea { width: 100%; padding: 12px 14px; background: var(--ip); border: 1px solid var(--bd); border-radius: var(--r); font-size: 14px; color: var(--tx); transition: .2s; }
.fld input:focus, .fld select:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(46,125,50,.15); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: var(--r); font-weight: 700; font-size: 14px; cursor: pointer; transition: .2s; justify-content: center; }
.btn-p { background: var(--p); color: #fff; }
.btn-p:hover { background: var(--p3); transform: translateY(-1px); }
.btn-s { background: var(--bd); color: var(--tx); }
.btn-s:hover { background: var(--bd2); }
.btn-d { background: #D32F2F; color: #fff; }
.btn-d:hover { background: #B71C1C; }
.btn-g { background: var(--gold); color: #1a1a1a; }
.btn-g:hover { background: #b89f2a; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 16px; font-size: 12px; }
.divider { text-align: center; padding: 16px 0; color: var(--tx3); font-size: 13px; }

/* DASHBOARD */
#dash { display: none; min-height: 100vh; }
#dash.on { display: flex; }
.sidebar { width: 240px; background: var(--sb); color: var(--sb-tx); display: flex; flex-direction: column; padding: 20px 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; }
.sb-hd { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,.06); }
.sb-hd .lic { width: 40px; height: 40px; font-size: 18px; }
.sb-hd .lt { color: #fff; font-size: 18px; }
.sb-role { margin: 16px 20px; padding: 8px 14px; border-radius: 40px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); }
.sb-role.admin { background: rgba(201,176,55,.25); color: #f0d050; }
.sb-role.professor { background: rgba(46,125,50,.25); color: #8bc34a; }
.sb-role.aluno { background: rgba(33,150,243,.2); color: #64b5f6; }
.sb-nav { flex: 1; padding: 12px 12px; }
.sb-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.3); padding: 16px 12px 8px; }
.ni { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: .2s; font-size: 14px; color: rgba(255,255,255,.6); }
.ni:hover { background: rgba(255,255,255,.06); color: #fff; }
.ni.on { background: rgba(46,125,50,.25); color: #8bc34a; font-weight: 600; }
.ni i { width: 20px; text-align: center; }
.sb-ft { border-top: 1px solid rgba(255,255,255,.06); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.sb-name { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8); }
.sb-out { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .2s; }
.sb-out:hover { background: rgba(211,47,47,.3); color: #ef5350; }

.main { flex: 1; margin-left: 240px; padding: 30px 36px; min-height: 100vh; background: var(--bg); }

/* CARDS / STATS */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 20px 0 28px; }
.st { background: var(--card-bg); padding: 18px 20px; border-radius: var(--r); box-shadow: var(--shadow); }
.st-v { font-size: 28px; font-weight: 800; color: var(--p); }
.st-l { font-size: 13px; color: var(--tx2); margin-top: 4px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 8px; }
.card { background: var(--card-bg); border-radius: var(--r); padding: 24px 20px; box-shadow: var(--shadow); cursor: pointer; transition: .25s; text-align: center; border: 1px solid transparent; }
.card:hover { transform: translateY(-4px); border-color: var(--p); }
.card-ic { font-size: 32px; color: var(--p); margin-bottom: 8px; }
.card-t { font-weight: 700; font-size: 15px; }
.card-d { font-size: 12px; color: var(--tx3); margin-top: 4px; }

/* PROGRESS */
.prog-w { background: var(--card-bg); border-radius: var(--r); padding: 18px 24px; margin: 12px 0 24px; box-shadow: var(--shadow); }
.prog-bar { height: 8px; background: var(--bd); border-radius: 40px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--p), var(--p2)); border-radius: 40px; transition: width .6s; }

/* NRs */
.nr-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.nr-c { background: var(--card-bg); border-radius: var(--r); padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); cursor: pointer; transition: .2s; border: 1px solid transparent; }
.nr-c:hover { border-color: var(--p); transform: translateY(-2px); }
.nr-ic { width: 40px; height: 40px; background: rgba(46,125,50,.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--p); flex-shrink: 0; }
.nr-num { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: .5px; }
.nr-nm { font-size: 14px; font-weight: 600; }

.badge { display: inline-block; padding: 2px 12px; border-radius: 40px; font-size: 11px; font-weight: 700; }
.bg-ok { background: rgba(46,125,50,.15); color: #2E7D32; }
.bg-warn { background: rgba(255,152,0,.15); color: #E65100; }
.bg-err { background: rgba(211,47,47,.15); color: #C62828; }
.bg-info { background: rgba(33,150,243,.15); color: #1565C0; }

/* TABLES */
.tw { overflow-x: auto; background: var(--card-bg); border-radius: var(--r); box-shadow: var(--shadow); }
.tw table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tw th { text-align: left; padding: 14px 18px; background: var(--bd2); font-weight: 600; color: var(--tx2); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.tw td { padding: 12px 18px; border-bottom: 1px solid var(--bd2); }
.tw tr:last-child td { border-bottom: 0; }

/* CHAT */
.chat-box { background: var(--card-bg); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.chat-msgs { height: 360px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.chat-m { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
.chat-m.u { align-self: flex-end; background: var(--p); color: #fff; border-bottom-right-radius: 4px; }
.chat-m.b { align-self: flex-start; background: var(--bd); color: var(--tx); border-bottom-left-radius: 4px; }
.chat-row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--bd); }
.chat-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--bd); border-radius: var(--r); background: var(--ip); color: var(--tx); }

/* PLANOS */
.planos-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 20px; }
.plan-c { background: var(--card-bg); border-radius: var(--r); padding: 28px 24px; text-align: center; box-shadow: var(--shadow); position: relative; border: 1px solid var(--bd); }
.plan-c.dest { border-color: var(--gold); background: linear-gradient(180deg, var(--card-bg), rgba(201,176,55,.04)); }
.badge-plan { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1a1a1a; font-size: 10px; font-weight: 800; padding: 4px 16px; border-radius: 40px; text-transform: uppercase; letter-spacing: .5px; }
.plan-c h3 { font-size: 20px; }
.plan-c .pst { color: var(--tx3); font-size: 13px; margin: 4px 0 12px; }
.plan-c .pr { font-size: 36px; font-weight: 800; color: var(--p); }
.plan-c .pr span { font-size: 20px; }
.plan-c .bl { color: var(--tx3); font-size: 12px; }
.plan-c .eco { color: var(--gold); font-weight: 700; font-size: 13px; margin: 4px 0 12px; }
.plan-c ul { list-style: none; text-align: left; padding: 12px 0; font-size: 13px; }
.plan-c ul li { padding: 4px 0; }
.plan-c ul li::before { content: '✓'; color: var(--p); margin-right: 8px; font-weight: 700; }
.plan-c ul li.off { opacity: .4; }
.plan-c ul li.off::before { content: '✗'; color: var(--tx3); }

/* TABS */
.tabs { display: flex; gap: 4px; background: var(--bd); border-radius: var(--r); padding: 4px; margin-bottom: 20px; }
.tab-b { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: .2s; color: var(--tx2); }
.tab-b.on { background: var(--card-bg); box-shadow: var(--shadow); color: var(--p); }
.tab-c { display: none; animation: fv .3s ease; }
.tab-c.on { display: block; }

/* MODAL */
.mdl-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
.mdl-bg.on { display: flex; }
.mdl { background: var(--card-bg); border-radius: 24px; padding: 32px 28px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.mdl-x { position: absolute; top: 12px; right: 16px; background: var(--bd); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; color: var(--tx); display: flex; align-items: center; justify-content: center; transition: .2s; }
.mdl-x:hover { background: var(--tx3); color: #fff; }

/* NOTIF POPUP */
.notif-popup { position: fixed; bottom: 30px; right: 30px; max-width: 380px; width: 100%; background: var(--card-bg); border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,.15); z-index: 1000; transform: translateY(120px); opacity: 0; transition: .4s; border-left: 4px solid var(--p); }
.notif-popup.show { transform: translateY(0); opacity: 1; }
.notif-popup-hd { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--p); color: #fff; border-radius: 16px 16px 0 0; }
.notif-popup-hd h4 { font-size: 14px; }
.notif-popup-bd { padding: 16px 18px; font-size: 14px; color: var(--tx); }
.notif-popup-ft { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px 18px; border-top: 1px solid var(--bd); }

/* TOAST */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--tx); color: #fff; padding: 12px 24px; border-radius: var(--r); font-weight: 500; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastIn .3s ease; pointer-events: auto; }
.toast.err { background: #C62828; }
.toast.warn { background: #E65100; }
.toast.info { background: #1565C0; }

/* MISC */
.empty { text-align: center; padding: 48px 20px; color: var(--tx3); }
.empty i { font-size: 48px; margin-bottom: 12px; opacity: .3; display: block; }
.empty h4 { font-size: 16px; color: var(--tx2); margin-top: 4px; }
.warn-b { background: rgba(255,152,0,.1); border-left: 4px solid #FF9800; padding: 14px 18px; border-radius: var(--r); display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 14px; }
.wc { font-size: 24px; font-weight: 800; }
.wcs { color: var(--tx2); margin-bottom: 20px; font-size: 15px; }
.btn-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tx3); cursor: pointer; margin-bottom: 16px; transition: .2s; }
.btn-back:hover { color: var(--p); }
.search { width: 100%; padding: 12px 16px; background: var(--ip); border: 1px solid var(--bd); border-radius: var(--r); font-size: 14px; color: var(--tx); margin: 12px 0; }

/* CONFIG */
.cfg-w { display: flex; gap: 24px; background: var(--card-bg); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.cfg-sb { width: 200px; padding: 20px; border-right: 1px solid var(--bd); flex-shrink: 0; }
.cfg-tb { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: .2s; font-size: 14px; color: var(--tx2); }
.cfg-tb:hover { background: var(--bd); }
.cfg-tb.on { background: var(--p); color: #fff; }
.cfg-bd { flex: 1; padding: 24px 28px; }
.cfg-sc { display: none; }
.cfg-sc.on { display: block; animation: fv .3s ease; }
.cfg-grp { margin-bottom: 18px; }
.cfg-grp label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--tx2); }
.cfg-grp input, .cfg-grp select { width: 100%; padding: 10px 14px; background: var(--ip); border: 1px solid var(--bd); border-radius: var(--r); font-size: 14px; color: var(--tx); }
.tema-g { display: flex; flex-wrap: wrap; gap: 12px; }
.tema-o { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 40px; border: 2px solid var(--bd); cursor: pointer; transition: .2s; font-size: 13px; }
.tema-o.on { border-color: var(--p); background: rgba(46,125,50,.08); }
.tema-dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }

/* PAY */
.pay-c { text-align: center; }
.copy-b { background: var(--ip); border: 1px dashed var(--bd); border-radius: var(--r); padding: 10px 14px; font-size: 12px; word-break: break-all; cursor: pointer; transition: .2s; font-family: monospace; }
.copy-b:hover { border-color: var(--p); background: rgba(46,125,50,.04); }
.qr-box { background: #fff; border-radius: var(--r); padding: 16px; display: inline-block; margin: 10px auto; }

/* GRID CHARTS */
.ch-g { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
.ch-b { background: var(--card-bg); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); }
.ch-b h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.pnl { background: var(--card-bg); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
.pnl-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.pnl-t { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.god-hd { margin-bottom: 20px; }
.god-hd h2 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
.god-hd p { color: var(--tx2); font-size: 14px; margin-top: 4px; }
.mt-c { background: var(--card-bg); border-radius: var(--r); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); margin-bottom: 12px; }
.mt-topic { font-weight: 700; font-size: 16px; }
.mt-id { font-size: 12px; color: var(--tx3); }

/* KEYFRAMES */
@keyframes fv { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* RESPONSIVE */
@media (max-width: 768px) {
    .sidebar { width: 64px; }
    .sb-hd .lt, .sb-role span, .sb-lbl, .ni span, .sb-name { display: none; }
    .ni { justify-content: center; padding: 12px; }
    .sb-role { justify-content: center; padding: 6px; }
    .sb-ft { justify-content: center; }
    .main { margin-left: 64px; padding: 20px 16px; }
    .ch-g { grid-template-columns: 1fr; }
    .cfg-w { flex-direction: column; }
    .cfg-sb { width: 100%; border-right: 0; border-bottom: 1px solid var(--bd); display: flex; flex-wrap: wrap; gap: 4px; }
    .auth-card { padding: 24px 18px; }
    .notif-popup { right: 10px; left: 10px; max-width: none; bottom: 10px; }
    .mt-c { flex-direction: column; align-items: stretch; gap: 10px; }
    .planos-g { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- ==================== AUTH ==================== -->
<div id="authWrap">
<div class="auth-card">
<!-- LOGIN -->
<div class="t on" id="tLogin">
<a href="index.html" class="back-to-site"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
<div class="logo-r"><div class="lic">SS</div><div class="lt">SulSafe</div></div>
<p class="sub">Acesse sua conta — 38 NRs, videoaulas e aulas ao vivo.</p>
<form id="frmLogin">
<div class="fld"><label>Email</label><input type="email" id="lEmail" placeholder="seu@email.com" required></div>
<div class="fld"><label>Senha</label><input type="password" id="lPass" placeholder="Sua senha" required></div>
<button type="submit" class="btn btn-p btn-block"><i class="fas fa-sign-in-alt"></i> Entrar</button>
</form>
<div class="divider">ou</div>
<button class="btn btn-s btn-block" onclick="showT('tCad')">Cadastrar nova conta</button>
</div>
<!-- CADASTRO -->
<div class="t" id="tCad">
<a href="index.html" class="back-to-site"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
<div class="logo-r"><div class="lic">SS</div><div class="lt">SulSafe</div></div>
<p class="sub">Crie sua conta e comece a estudar agora.</p>

$('#frmLogin').addEventListener('submit', async function(e) {
    e.preventDefault()
    const email = $('#lEmail').value.trim().toLowerCase()
    const pass = $('#lPass').value
    
    try {
        // Buscar usuário
        let { data: user, error } = await sbGetUserByEmail(email)
        
        // Se não existir e for admin, criar automaticamente
        if (error || !user) {
            if (email === ADMIN_EMAIL) {
                const result = await sbCreateUser('Administrador SulSafe', email, pass, 'admin')
                if (result.error) throw new Error(result.error.message)
                user = result.data
            } else {
                throw new Error('Usuário não encontrado')
            }
        }
        
        // Verificar senha (simples - em produção use bcrypt)
        if (user.senha_hash !== pass) {
            throw new Error('Senha incorreta')
        }
        
        S.user = user
        localStorage.setItem('ss_session', JSON.stringify({ id: user.id }))
        localStorage.setItem('ss_user', JSON.stringify(user))
        loadCfg()
        enterDash()
        toast('Bem-vindo(a), ' + user.nome + '!')
    } catch (error) {
        toast(error.message, 'err')
    }
})

$('#frmCad').addEventListener('submit', async function(e) {
    e.preventDefault()
    const nome = $('#cNome').value.trim()
    const email = $('#cEmail').value.trim().toLowerCase()
    const p1 = $('#cPass').value
    const p2 = $('#cPass2').value
    
    if (p1 !== p2) { toast('As senhas não coincidem', 'err'); return }
    if (p1.length < 6) { toast('Senha deve ter no mínimo 6 caracteres', 'err'); return }
    
    try {
        const role = email === ADMIN_EMAIL ? 'admin' : 'aluno'
        const { data: user, error } = await sbCreateUser(nome, email, p1, role)
        
        if (error) throw new Error(error.message)
        
        S.user = user
        localStorage.setItem('ss_session', JSON.stringify({ id: user.id }))
        localStorage.setItem('ss_user', JSON.stringify(user))
        loadCfg()
        enterDash()
        toast('Conta criada com sucesso!')
    } catch (error) {
        toast(error.message, 'err')
    }
})

async function pushNotif(msg, action, actionView) {
    if (!S.user) return
    await sbCriarNotificacao(S.user.id, 'Novo Conteúdo', msg, actionView)
    if (role() !== 'admin') showNotifPopup({ msg, view: actionView })
}

async function checkNotifs() {
    if (!S.user || role() === 'admin') return
    const { data } = await sbGetNotificacoes(S.user.id, false)
    if (data && data.length > 0) {
        const last = data[data.length - 1]
        if (Date.now() - new Date(last.criado_em).getTime() < 60000) {
            showNotifPopup({ msg: last.mensagem, view: last.link })
        }
    }
}

function showNotifPopup(n) {
    $('#notifBody').innerHTML = `<p>${n.msg}</p><p style="font-size:11px;color:var(--tx3);margin-top:6px">${fmtD(Date.now())}</p>`
    $('#notifAction').onclick = () => { closeNotif(); if (n.view) nav(n.view) }
    $('#notifPopup').classList.add('show')
    setTimeout(closeNotif, 8000)
}

    }
    if (isProf()) {
        h += cCard('fa-file-pen', 'Lancar Notas', 'Notas dos alunos', 'boletim')
        h += cCard('fa-certificate', 'Certificados', 'Emitir certificados', 'certificados')

        h += cCard('fa-shield-halved', 'Modo Deus', 'Controle total', 'admin')
    }
    h += `</div>`
    
    // Carregar dados do Supabase para o dashboard
    setTimeout(async () => {
        try {
            const { data: metrics } = await sbGetDashboardMetrics()

            const statsDiv = document.getElementById('statsInicio')
            if (!statsDiv) return
            
            if (r === 'aluno') {
                const total = NRS.length
                const concluidas = progresso?.assistidas || 0
                const pct = total ? Math.round(concluidas / total * 100) : 0
                const pendentes = total - concluidas
                const pagos = transacoes?.filter(t => t.status === 'pago').length || 0
                statsDiv.innerHTML = `
                    ${stC(pct + '%', 'Progresso', 'fa-chart-line')}
                    ${stC(concluidas, 'Videos Vistos', 'fa-check-circle')}
                    ${stC(pendentes, 'Videos Pendentes', 'fa-clock')}

                        <span style="font-weight:800;color:var(--p);font-size:18px">${pct}%</span>
                    </div>

                    <p style="font-size:11px;color:var(--tx3);margin-top:6px">${concluidas} de ${total} NRs concluídas — ${pendentes} pendentes</p>

                statsDiv.parentNode.insertBefore(progDiv, statsDiv.nextSibling)
            } else {
                const alunos = metrics?.total_alunos || 0
                const receita = metrics?.receita_total || 0
                const { data: salas } = await sbGetSalasAtivas()
                statsDiv.innerHTML = `
                    ${stC(alunos, 'Alunos', 'fa-users')}
                    ${stC(salas?.length || 0, 'Salas Ativas', 'fa-tower-broadcast')}
                    ${stC(fmtM(receita), 'Receita', 'fa-dollar-sign')}
                    ${stC(NRS.length, 'NRs', 'fa-book')}

            }
        } catch (e) {
            console.error('Erro ao carregar dashboard:', e)
        }
    }, 100)
    
    return h
}

async function carregarProgressoVideoaulas() {
    if (!S.user) return
    const { data: progressos } = await sbGetProgressoUsuario(S.user.id)
    const concluidas = progressos?.filter(p => p.concluído === true).map(p => p.aula_id) || []
    const total = NRS.length
    const pct = total ? Math.round(concluidas.length / total * 100) : 0
    
    const progDiv = document.getElementById('progressoVideoaulas')
    if (progDiv) {
        progDiv.innerHTML = `
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                <span style="font-weight:600;font-size:13px">Seu Progresso</span>
                <span style="font-weight:800;color:var(--p)">${pct}%</span>
            </div>
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        `
    }
    
    NRS.forEach(nr => {
        const badge = document.getElementById(`badge-${nr.id}`)
        const btn = document.getElementById(`btn-${nr.id}`)
        const done = concluidas.includes(nr.id)
        if (badge) badge.style.display = done ? 'inline-block' : 'none'
        if (btn) {
            btn.className = `btn btn-sm ${done ? 'btn-p' : 'btn-s'}`
            btn.innerHTML = done ? '<i class="fas fa-check"></i> Concluida' : 'Marcar como concluida'
        }
    })
}

async function toggleAulaSupabase(nrId, btn) {
    if (!S.user) return
    const { data: progressos } = await sbGetProgressoUsuario(S.user.id)
    const existente = progressos?.find(p => p.aula_id === nrId)
    
    if (existente) {
        await sbSalvarProgresso(S.user.id, nrId, 0, false)
        btn.className = 'btn btn-sm btn-s'
        btn.innerHTML = 'Marcar como concluida'
        document.getElementById(`badge-${nrId}`).style.display = 'none'
        toast('Aula desmarcada', 'info')
    } else {
        await sbSalvarProgresso(S.user.id, nrId, 300, true)
        btn.className = 'btn btn-sm btn-p'
        btn.innerHTML = '<i class="fas fa-check"></i> Concluida'
        document.getElementById(`badge-${nrId}`).style.display = 'inline-block'
        toast('Aula concluída! 🎉')
    }
    carregarProgressoVideoaulas()
}

async function carregarSalas() {
    const { data: salas } = await sbGetSalasAtivas()
    const container = document.getElementById('listaSalas')
    if (!container) return
    
    if (!salas || salas.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-tower-broadcast"></i><p>Nenhuma sala ativa no momento.</p></div>`
        return
    }
    
    let h = ''
    salas.forEach(s => {
        h += `<div class="mt-c">
            <div>
                <div class="mt-topic">${s.topico}</div>
                <div class="mt-id">ID: ${s.meet_id || 'N/A'}</div>
                <div style="font-size:11px;color:var(--tx3);margin-top:4px">Criada por: ${s.profiles?.nome || '—'} — ${fmtD(s.created_at)}</div>
            </div>
            <div style="display:flex;gap:8px">
                <a href="https://meet.google.com/${s.meet_id || ''}" target="_blank" class="btn btn-p btn-sm"><i class="fas fa-video"></i> Entrar na Sala</a>
                ${canManage() ? `<button class="btn btn-d btn-sm" onclick="encerrarSalaSupabase('${s.id}')"><i class="fas fa-times"></i></button>` : ''}
            </div>
        </div>`
    })
    container.innerHTML = h
}

async function criarSalaSupabase() {
    const top = $('#salaTop')?.value?.trim()
    const meet = $('#salaMeet')?.value?.trim()
    if (!top) { toast('Informe o topico', 'err'); return }
    const { data, error } = await sbCriarSala(top, meet, uid())
    if (error) { toast('Erro ao criar sala: ' + error.message, 'err'); return }
    toast('Sala criada!')
    pushNotif(`Nova sala ao vivo: "${top}"`, 'Entrar', 'salas')
    carregarSalas()
    $('#salaTop').value = ''
    $('#salaMeet').value = ''
}

async function encerrarSalaSupabase(id) {
    if (!confirm('Encerrar esta sala?')) return
    await sbEncerrarSala(id)
    toast('Sala encerrada', 'info')
    carregarSalas()
}

    h += `<div class="pnl"><div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="chat-m b">Ola! Sou o assistente IA da SulSafe. Pergunte sobre qualquer NR, EPI, CIPA, PPP, PCMSO e muito mais.</div></div><div class="chat-row"><input id="chatIn" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter')sendIA()"><button class="btn btn-p btn-sm" onclick="sendIA()"><i class="fas fa-paper-plane"></i></button></div></div></div>`

function sendIA() {
    const inp = $('#chatIn'), msg = inp.value.trim()
    if (!msg) return
    const msgs = $('#chatMsgs')
    msgs.innerHTML += `<div class="chat-m u">${msg}</div>`
    inp.value = ''
    msgs.scrollTop = msgs.scrollHeight
    setTimeout(() => {
        msgs.innerHTML += `<div class="chat-m b">${genIA(msg)}</div>`
        msgs.scrollTop = msgs.scrollHeight
    }, 500 + Math.random() * 700)
}

function genIA(q) {
    const ql = q.toLowerCase()
    if (ql.includes('nr 10') || ql.includes('eletricidade')) return 'A <strong>NR 10</strong> estabelece requisitos de seguranca em instalacoes e servicos em eletricidade. Exige treinamento especifico (SEP), EPIs adequados, e que as instalacoes atendam a NBR 5410. Curso basico: 40h, complementar SEP: 40h.'
    if (ql.includes('nr 35') || ql.includes('altura')) return 'A <strong>NR 35</strong> regulamenta trabalho em altura (acima de 2m). Exige: Analise de Risco, Permissao de Trabalho, treinamento 8h, cinto tipo paraquedista com duplo talabarte, pontos de ancoragem com resistencia minima 15kN.'
    if (ql.includes('nr 6') || ql.includes('epi')) return 'A <strong>NR 6</strong> regulamenta os EPIs. O empregador deve fornecer gratuitamente, adequados ao risco. Todo EPI deve ter CA do MTE. Exemplos: capacete, oculos, luvas, protetor auricular, cinto de seguranca.'
    if (ql.includes('nr 5') || ql.includes('cipa')) return 'A <strong>NR 5</strong> regulamenta a CIPA. Obrigatória para empresas com mais de 20 empregados. Composicao paritaria, mandato 1 ano. Realiza mapas de risco, investiga acidentes.'
    if (ql.includes('nr 9') || ql.includes('ppra')) return 'A <strong>NR 9</strong> exige o PPRA. Deve abranger todos os trabalhadores, identificar e avaliar riscos, definir medidas de controle. Atualizado anualmente. Mantido por 20 anos.'
    if (ql.includes('certificado')) return 'Os certificados sao emitidos pelo admin ou professor ao concluir o curso com nota minima. Contem: nome, NR, carga horaria, data e codigo de verificacao unico.'
    if (ql.includes('pagamento') || ql.includes('boleto') || ql.includes('pix')) return 'Aceitamos <strong>PIX</strong> (aprovacao instantanea) e <strong>Boleto Bancario</strong> (ate 3 dias uteis). Apos confirmacao, seu acesso e liberado automaticamente.'
    return `Sobre "<strong>${q}</strong>": As NRs sao extensas. Recomendo consultar o catalogo da plataforma. Tente perguntar sobre uma NR especifica (ex: "NR 10", "EPI", "CIPA").`
}

async function assinarPlanoSupabase(nome, valor, qtd) {
    const intervalo = qtd === 12 ? 1 : qtd === 3 ? 3 : 12
    const hoje = new Date()
    let criados = 0
    for (let i = 0; i < qtd; i++) {
        const venc = new Date(hoje)
        venc.setMonth(venc.getMonth() + i * intervalo)
        if (venc.getDay() === 0) venc.setDate(venc.getDate() + 1)
        const linha = genDigitable()
        const pix = genPix()
        const { error } = await sbCriarTransacao(
            uid(), nome, valor, venc.toISOString().split('T')[0], linha, pix
        )
        if (!error) criados++
    }
    toast(`${criados} boleto(s) do plano ${nome} gerados!`)
    if (criados > 0) {
        const { data: transacoes } = await sbGetTransacoesUsuario(uid())
        if (transacoes && transacoes.length > 0) verBoletoSupabase(transacoes[0].id)
    }
    renderV()
}

async function emitCertSupabase() {
    const aid = $('#cAluno')?.value, nrid = $('#cNR')?.value, ch = parseInt($('#cCH')?.value) || 40
    if (!aid || !nrid) { toast('Selecione aluno e NR', 'err'); return }
    const { data: notas } = await sbGetNotasAluno(aid)
    const notaEntry = notas?.find(n => n.nr_id === nrid)
    const { data, error } = await sbEmitirCertificado(aid, nrid, notaEntry?.nota, ch)
    if (error) { toast('Erro ao emitir: ' + error.message, 'err'); return }
    toast('Certificado emitido!')
    pushNotif(`Certificado emitido para NR ${nrid}!`, 'Ver certificado', 'certificados')
    carregarCertsAdmin()
}

async function delCertSupabase(id) {
    if (!confirm('Excluir?')) return
    await sbDeletarCertificado(id)
    toast('Excluido', 'info')
    carregarCertsAdmin()
}

async function drawChartAdminSupabase() {
    const cv1 = document.getElementById('chartAdmProg'), cv2 = document.getElementById('chartAdmRoles')
    const { data: ranking } = await sbGetRankingAlunos()
    const { data: users } = await sbGetAllUsers()
    
    if (cv1 && ranking) {
        let p0 = 0, p1 = 0, p2 = 0, p3 = 0
        ranking.forEach(a => {
            const pct = a.progresso || 0
            if (pct === 0) p0++
            else if (pct <= 50) p1++
            else if (pct <= 80) p2++
            else p3++
        })
        if (charts.admProg) try { charts.admProg.destroy() } catch (e) {}
        charts.admProg = new Chart(cv1, { type: 'bar', data: { labels: ['0%', '1-50%', '51-80%', '81-100%'], datasets: [{ label: 'Alunos', data: [p0, p1, p2, p3], backgroundColor: ['rgba(211,47,47,.7)', 'rgba(255,152,0,.7)', 'rgba(21,101,192,.7)', 'rgba(46,125,50,.7)'], borderRadius: 6 }] }, options: { responsive: true, plugins: { legend: { display: false } } } })
    }
    if (cv2 && users) {
        const rc = { admin: 0, professor: 0, aluno: 0 }
        users.forEach(u => { rc[u.role] = (rc[u.role] || 0) + 1 })
        if (charts.admRoles) try { charts.admRoles.destroy() } catch (e) {}
        charts.admRoles = new Chart(cv2, { type: 'doughnut', data: { labels: ['Admin', 'Professor', 'Aluno'], datasets: [{ data: [rc.admin, rc.professor, rc.aluno], backgroundColor: ['rgba(201,176,55,.8)', 'rgba(46,125,50,.8)', 'rgba(21,101,192,.8)'] }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } })
    }
}
