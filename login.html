/* ============================================================
   AUTH — LOGIN / CADASTRO (CORRIGIDO - APENAS UM LISTENER POR FORM)
   ============================================================ */
$('#frmLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = $('#lEmail').value.trim().toLowerCase();
    const pass = $('#lPass').value;
    let u = S.users.find(x => x.email === email && x.pass === pass);
    
    if (!u) {
        if (email === ADMIN_EMAIL) {
            u = { id: genId(), nome: 'Administrador SulSafe', email, pass, role: 'admin', created: Date.now() };
            S.users.push(u); 
            save('users', S.users);
        } else { 
            toast('Email ou senha incorretos', 'err'); 
            return; 
        }
    }
    
    S.user = u;
    
    // FORÇA ROLE ADMIN SE FOR O EMAIL ADMIN
    if (S.user.email === ADMIN_EMAIL) {
        S.user.role = 'admin';
        const idx = S.users.findIndex(x => x.id === S.user.id);
        if(idx >= 0) S.users[idx].role = 'admin';
        save('users', S.users);
    }
    
    localStorage.setItem('ss_session', JSON.stringify({ id: u.id }));
    loadCfg();
    enterDash();
    toast('Bem-vindo(a), ' + u.nome + '!');
});

$('#frmCad').addEventListener('submit', function(e) {
    e.preventDefault();
    const nome = $('#cNome').value.trim(), email = $('#cEmail').value.trim().toLowerCase();
    const p1 = $('#cPass').value, p2 = $('#cPass2').value;
    if (p1 !== p2) { toast('As senhas nao coincidem', 'err'); return; }
    if (S.users.find(x => x.email === email)) { toast('Email ja cadastrado', 'err'); return; }
    const u = { id: genId(), nome, email, pass: p1, role: 'aluno', created: Date.now() };
    S.users.push(u); 
    save('users', S.users);
    S.user = u;
    
    localStorage.setItem('ss_session', JSON.stringify({ id: u.id }));
    
    if (S.user.email === ADMIN_EMAIL) {
        S.user.role = 'admin';
        const idx = S.users.findIndex(x => x.id === S.user.id);
        if(idx >= 0) S.users[idx].role = 'admin';
        save('users', S.users);
    }
    
    loadCfg();
    enterDash();
    toast('Conta criada com sucesso!');
});

    S.user = null;
    localStorage.removeItem('ss_session');
    destroyCharts();
    window.location.href = LANDING_URL;
}

/* ============================================================
   AUTO-LOGIN — Se ja tem sessao, entra direto no dashboard
   ============================================================ */
(function() {
    try {
        const s = localStorage.getItem('ss_session');
        if (s) {
            const { id } = JSON.parse(s);
            const u = S.users.find(x => x.id === id);
            if (u) { 
                S.user = u; 
                loadCfg(); 
                enterDash(); 
            }
        }
    } catch(e) {
        console.log('Erro no auto-login:', e);
    }
})();

function enterDash() {

}

function pushNotif(msg, action, actionView) {
    S.notifs.push({ id: genId(), msg, action: action || 'Ver', view: actionView || 'inicio', ts: Date.now(), readBy: [] });
    save('notifs', S.notifs);
    if (S.user && role() !== 'admin') showNotifPopup(S.notifs[S.notifs.length - 1]);
}

function showNotifPopup(n) {
    $('#notifBody').innerHTML = `<p>${n.msg}</p><p style="font-size:11px;color:var(--tx3);margin-top:6px">${fmtD(n.ts)}</p>`;
    $('#notifAction').onclick = () => { closeNotif(); nav(n.view || 'inicio'); };
    $('#notifPopup').classList.add('show');
    setTimeout(closeNotif, 8000);
}

function checkNotifs() {
    if (!S.user || role() === 'admin') return;
    const unread = S.notifs.filter(n => !n.readBy?.includes(uid()));
    if (unread.length) { 
        const last = unread[unread.length - 1]; 
        if (Date.now() - last.ts < 60000) showNotifPopup(last); 
    }
}

/* ============================================================
   BOTÃO SUBIR MATERIAIS - CORRIGIDO
   ============================================================ */
function adicionarBotaoMateriais() {
    const mc = document.getElementById('mc');
    if(!mc) return;
    
    // Remove botão existente se houver
    const btnExistente = document.getElementById('btnSubirMateriais');
    if(btnExistente) btnExistente.remove();
    
    // Verifica se estamos na view correta (inicio)
    if(S.view !== 'inicio') return;
    
    // Procura o grid de cards
    const cardsGrid = mc.querySelector('.cards');
    if(!cardsGrid) return;
    
    // Cria o botão
    const btn = document.createElement('button');
    btn.id = 'btnSubirMateriais';
    btn.innerHTML = '<i class="fas fa-upload"></i> Subir Materiais';
    btn.style.cssText = 'display:block; margin:30px auto 0; padding:14px 28px; background:#22c55e; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:700; font-size:16px; box-shadow:0 4px 12px rgba(34,197,94,0.3); transition: transform 0.2s;';
    btn.onmouseover = function() { this.style.transform = 'scale(1.02)'; };
    btn.onmouseout = function() { this.style.transform = 'scale(1)'; };
    btn.onclick = function() {
        // Exemplo de modal para upload
        openMdl(`
            <button class="mdl-x" onclick="closeMdl()"><i class="fas fa-times"></i></button>
            <h2 style="font-size:18px;font-weight:700;color:var(--p);margin-bottom:16px">Subir Materiais</h2>
            <div class="fld">
                <label>Selecione os arquivos</label>
                <input type="file" multiple style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--ip);">
            </div>
            <div class="fld">
                <label>Descrição</label>
                <textarea rows="3" style="width:100%;background:var(--ip);border:1px solid var(--bd);border-radius:var(--r);padding:10px;color:var(--tx);font-size:13px;resize:vertical" placeholder="Descrição dos materiais..."></textarea>
            </div>
            <button class="btn btn-p btn-block" onclick="closeMdl(); toast('Materiais enviados com sucesso!')"><i class="fas fa-upload"></i> Enviar</button>
        `);
    };
    
    // Insere o botão após o grid de cards
    cardsGrid.parentNode.insertBefore(btn, cardsGrid.nextSibling);
}

function vInicio() {
    const r = role();
    const concluidas = S.aulas.filter(a => a.uid === uid()).length;
    const total = NRS.length;
    const pct = total ? Math.round(concluidas / total * 100) : 0;
    const pendentes = total - concluidas;
    let h = `<div class="btn-back" onclick="nav('${S.prevView || 'inicio'}')"><i class="fas fa-arrow-left"></i> Voltar</div>`;
    h += `<h2 class="wc">Ola, ${S.user?.nome || 'Usuario'}</h2>`;
    h += `<p class="wcs">Painel ${r === 'admin' ? 'Administrativo (Modo Deus)' : r === 'professor' ? 'do Professor' : 'do Aluno'} — ${new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>`;
    if (r === 'aluno') {
        const vencendo = S.boletos.filter(b => b.uid === uid() && b.status === 'pendente' && new Date(b.venc) <= new Date(Date.now() + 7 * 864e5));
        if (vencendo.length) h += `<div class="warn-b"><i class="fas fa-exclamation-triangle"></i><div>Voce tem <strong>${vencendo.length} boleto(s)</strong> vencendo em breve! <a href="#" onclick="nav('boletos');return false" style="color:var(--p);font-weight:700;text-decoration:underline">Ver boletos</a></div></div>`;
    }
    h += `<div class="stats">`;

function vIA() {
    let h = `<div class="btn-back" onclick="nav('inicio')"><i class="fas fa-arrow-left"></i> Voltar</div>`;
    h += `<h2 class="wc">Assistente IA</h2><p class="wcs">Tire duvidas sobre NRs e seguranca do trabalho.</p>`;
    h += `<div class="pnl"><div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="chat-m b">Ola! Sou o assistente IA da SulSafe. Pergunte sobre qualquer NR, EPI, CIPA, PPP, PCMSO e muito mais.</div></div><div class="chat-row"><input id="chatIn" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter')sendIA()"><button class="btn btn-p btn-sm" onclick="sendIA()"><i class="fas fa-paper-plane"></i></button></div></div></div>`;

function sendIA() {
    const inp = $('#chatIn'), msg = inp.value.trim(); if (!msg) return;
    const msgs = $('#chatMsgs');
    msgs.innerHTML += `<div class="chat-m u">${msg}</div>`; inp.value = ''; msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => { msgs.innerHTML += `<div class="chat-m b">${genIA(msg)}</div>`; msgs.scrollTop = msgs.scrollHeight; }, 500 + Math.random() * 700);
}

function genIA(q) {
    const ql = q.toLowerCase();
    if (ql.includes('nr 10') || ql.includes('eletricidade')) return 'A <strong>NR 10</strong> estabelece requisitos de seguranca em instalacoes e servicos em eletricidade. Exige treinamento especifico (SEP), EPIs adequados, e que as instalacoes atendam a NBR 5410. Curso basico: 40h, complementar SEP: 40h.';
    if (ql.includes('nr 35') || ql.includes('altura')) return 'A <strong>NR 35</strong> regulamenta trabalho em altura (acima de 2m). Exige: Analise de Risco, Permissao de Trabalho, treinamento 8h, cinto tipo paraquedista com duplo talabarte, pontos de ancoragem com resistencia minima 15kN.';
    if (ql.includes('nr 6') || ql.includes('epi')) return 'A <strong>NR 6</strong> regulamenta os EPIs. O empregador deve fornecer gratuitamente, adequados ao risco. Todo EPI deve ter CA do MTE. Exemplos: capacete, oculos, luvas, protetor auricular, cinto de seguranca.';
    if (ql.includes('nr 5') || ql.includes('cipa')) return 'A <strong>NR 5</strong> regulamenta a CIPA. Obrigatória para empresas com mais de 20 empregados. Composicao paritaria, mandato 1 ano. Realiza mapas de risco, investiga acidentes.';
    if (ql.includes('nr 9') || ql.includes('ppra')) return 'A <strong>NR 9</strong> exige o PPRA. Deve abranger todos os trabalhadores, identificar e avaliar riscos, definir medidas de controle. Atualizado anualmente. Mantido por 20 anos.';
    if (ql.includes('certificado')) return 'Os certificados sao emitidos pelo admin ou professor ao concluir o curso com nota minima. Contem: nome, NR, carga horaria, data e codigo de verificacao unico.';
    if (ql.includes('pagamento') || ql.includes('boleto') || ql.includes('pix')) return 'Aceitamos <strong>PIX</strong> (aprovacao instantanea) e <strong>Boleto Bancario</strong> (ate 3 dias uteis). Apos confirmacao, seu acesso e liberado automaticamente.';
    return `Sobre "<strong>${q}</strong>": As NRs sao extensas. Recomendo consultar o catalogo da plataforma. Tente perguntar sobre uma NR especifica (ex: "NR 10", "EPI", "CIPA").`;
}

function saveNota(e, aid) {

function assinarPlano(nome, valor, qtd) {
    const intervalo = qtd === 12 ? 1 : qtd === 3 ? 3 : 12;
    const hoje = new Date();
    const novos = [];
    for (let i = 0; i < qtd; i++) {
        const venc = new Date(hoje); venc.setMonth(venc.getMonth() + i * intervalo);
        if (venc.getDay() === 0) venc.setDate(venc.getDate() + 1);
        novos.push({ id: genId(), uid: uid(), plano: nome, valor, metodo: 'boleto', status: 'pendente', venc: venc.toISOString().split('T')[0], linha: genDigitable(), pix: genPix(), ts: Date.now() });
    }
    S.boletos.push(...novos); save('boletos', S.boletos);
    toast(`${qtd} boleto(s) do plano ${nome} gerados!`);
    verBoleto(novos[0].id); renderV();
}

function vConfig() {
    const c = S.cfg;
    const temas = [{ id: 'verde', cor: '#2E7D32', nm: 'Verde' }, { id: 'azul', cor: '#1565C0', nm: 'Azul' }, { id: 'roxo', cor: '#7B1FA2', nm: 'Roxo' }, { id: 'vermelho', cor: '#C62828', nm: 'Vermelho' }, { id: 'laranja', cor: '#E65100', nm: 'Laranja' }, { id: 'escuro', cor: '#1a1a1a', nm: 'Escuro' }];
    let h = `<div class="btn-back" onclick="nav('inicio')"><i class="fas fa-arrow-left"></i> Voltar</div>`;
    h += `<h2 class="wc">Configuracoes</h2><p class="wcs">Personalize sua experiencia na plataforma.</p>`;
    h += `<div class="cfg-w"><div class="cfg-sb"><div class="cfg-tb on" onclick="cfgTab('tema',this)"><i class="fas fa-palette"></i><span>Tema</span></div><div class="cfg-tb" onclick="cfgTab('video',this)"><i class="fas fa-video"></i><span>Video</span></div><div class="cfg-tb" onclick="cfgTab('audio',this)"><i class="fas fa-volume-high"></i><span>Audio</span></div><div class="cfg-tb" onclick="cfgTab('geral',this)"><i class="fas fa-sliders-h"></i><span>Geral</span></div></div>`;
    h += `<div class="cfg-bd">`;
    h += `<div class="cfg-sc on" id="cfgTema"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Cores do Tema</h3><div class="tema-g">`;
    temas.forEach(t => { h += `<div class="tema-o${c.tema === t.id ? ' on' : ''}" onclick="setTema('${t.id}')"><div class="tema-dot" style="background:${t.cor};${t.id === 'escuro' ? 'border:2px solid #555' : ''}"></div>${t.nm}</div>`; });
    h += `</div></div>`;
    h += `<div class="cfg-sc" id="cfgVideo"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Configuracoes de Video</h3><div class="cfg-grp"><label>Qualidade Padrao</label><select id="cfgQual" onchange="saveCfg()"><option value="sd"${c.qual === 'sd' ? ' selected' : ''}>SD (480p)</option><option value="hd"${c.qual === 'hd' ? ' selected' : ''}>HD (720p)</option><option value="fhd"${c.qual === 'fhd' ? ' selected' : ''}>Full HD (1080p)</option><option value="auto"${c.qual === 'auto' ? ' selected' : ''}>Automatico</option></select></div><div class="cfg-grp"><label>Velocidade</label><select id="cfgSpeed" onchange="saveCfg()"><option value="0.75"${c.speed === '0.75' ? ' selected' : ''}>0.75x</option><option value="1"${c.speed === '1' ? ' selected' : ''}>1x</option><option value="1.25"${c.speed === '1.25' ? ' selected' : ''}>1.25x</option><option value="1.5"${c.speed === '1.5' ? ' selected' : ''}>1.5x</option><option value="2"${c.speed === '2' ? ' selected' : ''}>2x</option></select></div></div>`;
    h += `<div class="cfg-sc" id="cfgAudio"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Configuracoes de Audio</h3><div class="cfg-grp"><label>Volume Geral: <strong id="volVal">${c.vol}%</strong></label><input type="range" id="cfgVol" min="0" max="100" value="${c.vol}" oninput="$('#volVal').textContent=this.value+'%';saveCfg()"></div><div class="cfg-grp"><label>Volume da IA</label><input type="range" min="0" max="100" value="80"></div></div>`;
    h += `<div class="cfg-sc" id="cfgGeral"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Configuracoes Gerais</h3><div class="cfg-grp"><label>Notificacoes de Novo Conteudo</label><select onchange="S.cfg.notifs=this.value==='true';saveCfg()"><option value="true"${c.notifs !== false ? ' selected' : ''}>Ativadas</option><option value="false"${c.notifs === false ? ' selected' : ''}>Desativadas</option></select></div><div class="cfg-grp"><label>Nome de Exibicao</label><input type="text" value="${S.user?.nome || ''}" onchange="S.user.nome=this.value;save('users',S.users);renderSB()"></div></div>`;
    h += `</div></div>`;
    return h;
}

function cfgTab(id, el) { $$('.cfg-tb').forEach(t => t.classList.remove('on')); el.classList.add('on'); $$('.cfg-sc').forEach(s => s.classList.remove('on')); const map = { tema: 'cfgTema', video: 'cfgVideo', audio: 'cfgAudio', geral: 'cfgGeral' }; $('#' + map[id])?.classList.add('on'); }
function setTema(id) { document.body.className = id === 'verde' ? '' : 't-' + id; S.cfg.tema = id; saveCfg(); $$('.tema-o').forEach(o => o.classList.remove('on')); event.currentTarget.classList.add('on'); toast('Tema alterado!'); }
function saveCfg() { const q = $('#cfgQual')?.value, sp = $('#cfgSpeed')?.value, v = $('#cfgVol')?.value; if (q) S.cfg.qual = q; if (sp) S.cfg.speed = sp; if (v) S.cfg.vol = parseInt(v); save('cfg', S.cfg); }
function loadCfg() { document.body.className = S.cfg.tema === 'verde' ? '' : 't-' + S.cfg.tema; }

/* ============================================================
   GRAFICOS
   ============================================================ */
let charts = {};
function destroyCharts() { Object.values(charts).forEach(c => { try { c.destroy() } catch (e) { } }); charts = {}; }

function drawChartAluno() {
    const cv = document.getElementById('chartBoletimAluno'); if (!cv) return;
    const minhas = S.notas.filter(n => n.uid === uid());
    if (charts.aluno) try { charts.aluno.destroy() } catch (e) { }
    charts.aluno = new Chart(cv, { type: 'bar', data: { labels: minhas.map(n => 'NR ' + n.nrid), datasets: [{ label: 'Nota', data: minhas.map(n => Number(n.nota || 0)), backgroundColor: minhas.map(n => Number(n.nota) >= 7 ? 'rgba(46,125,50,.7)' : Number(n.nota) >= 5 ? 'rgba(255,152,0,.7)' : 'rgba(211,47,47,.7)'), borderRadius: 6 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } } } } });
}

function drawChartNotas() {
    const cv = document.getElementById('chartMediasNR'); if (!cv) return;
    const map = {}; S.notas.forEach(n => { if (!map[n.nrid]) map[n.nrid] = { s: 0, c: 0 }; map[n.nrid].s += Number(n.nota || 0); map[n.nrid].c++; });
    const labels = Object.keys(map).sort((a, b) => a - b).map(k => 'NR ' + k);
    const data = Object.keys(map).sort((a, b) => a - b).map(k => +(map[k].s / map[k].c).toFixed(1));
    if (charts.notas) try { charts.notas.destroy() } catch (e) { }
    charts.notas = new Chart(cv, { type: 'bar', data: { labels, datasets: [{ label: 'Media', data, backgroundColor: 'rgba(46,125,50,.7)', borderRadius: 6 }] }, options: { responsive: true, scales: { y: { min: 0, max: 10 } } } });
}

function drawChartPay() {
    const cv1 = document.getElementById('chartPayStatus'), cv2 = document.getElementById('chartPayMes');
    if (cv1) { const p = S.boletos.filter(b => b.status === 'pago').length, pe = S.boletos.filter(b => b.status === 'pendente').length; if (charts.paySt) try { charts.paySt.destroy() } catch (e) { } charts.paySt = new Chart(cv1, { type: 'doughnut', data: { labels: ['Pagos', 'Pendentes'], datasets: [{ data: [p, pe], backgroundColor: ['rgba(46,125,50,.8)', 'rgba(255,152,0,.8)'] }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } }); }
    if (cv2) { const mm = {}; S.boletos.filter(b => b.status === 'pago').forEach(b => { const m = b.venc?.substr(0, 7) || 'N/A'; mm[m] = (mm[m] || 0) + Number(b.valor || 0); }); if (charts.payMes) try { charts.payMes.destroy() } catch (e) { } charts.payMes = new Chart(cv2, { type: 'bar', data: { labels: Object.keys(mm), datasets: [{ label: 'Receita (R$)', data: Object.values(mm), backgroundColor: 'rgba(46,125,50,.7)', borderRadius: 6 }] }, options: { responsive: true } }); }
}

function drawChartAdmin() {
    const cv1 = document.getElementById('chartAdmProg'), cv2 = document.getElementById('chartAdmRoles');
    const alunos = S.users.filter(u => u.role === 'aluno');
    if (cv1) { let p0 = 0, p1 = 0, p2 = 0, p3 = 0; alunos.forEach(a => { const c = S.aulas.filter(x => x.uid === a.id).length; const pct = c / NRS.length * 100; if (pct === 0) p0++; else if (pct <= 50) p1++; else if (pct <= 80) p2++; else p3++; }); if (charts.admProg) try { charts.admProg.destroy() } catch (e) { } charts.admProg = new Chart(cv1, { type: 'bar', data: { labels: ['0%', '1-50%', '51-80%', '81-100%'], datasets: [{ label: 'Alunos', data: [p0, p1, p2, p3], backgroundColor: ['rgba(211,47,47,.7)', 'rgba(255,152,0,.7)', 'rgba(21,101,192,.7)', 'rgba(46,125,50,.7)'], borderRadius: 6 }] }, options: { responsive: true, plugins: { legend: { display: false } } } }); }
    if (cv2) { const rc = { admin: 0, professor: 0, aluno: 0 }; S.users.forEach(u => { rc[u.role] = (rc[u.role] || 0) + 1; }); if (charts.admRoles) try { charts.admRoles.destroy() } catch (e) { } charts.admRoles = new Chart(cv2, { type: 'doughnut', data: { labels: ['Admin', 'Professor', 'Aluno'], datasets: [{ data: [rc.admin, rc.professor, rc.aluno], backgroundColor: ['rgba(201,176,55,.8)', 'rgba(46,125,50,.8)', 'rgba(21,101,192,.8)'] }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } }); }
}
