<!-- SCRIPT DE LOGIN - USANDO auth.js -->
<script type="module">
console.log('📄 Login page iniciada...');

// Importa as funções de autenticação
import { handleLogin, handleCadastro, checkAuth } from './js/auth.js';

// ============================================================
// ELEMENTOS DO DOM
// ============================================================
const frmLogin = document.getElementById('frmLogin');
const frmCadastro = document.getElementById('frmCadastro');
const lEmail = document.getElementById('lEmail');
const lPass = document.getElementById('lPass');
const cNome = document.getElementById('cNome');
const cEmail = document.getElementById('cEmail');
const cPass = document.getElementById('cPass');
const cPass2 = document.getElementById('cPass2');
const cTermos = document.getElementById('cTermos');

// ============================================================
// FUNÇÕES GLOBAIS (para os onclick do HTML)
// ============================================================
window.showT = function(tabId) {
    document.querySelectorAll('.auth-card .t').forEach(el => el.classList.remove('on'));
    document.getElementById(tabId).classList.add('on');
};

window.recuperarSenha = function() {
    const email = prompt('Digite seu email para recuperar a senha:');
    if (email && email.includes('@')) {
        alert('Instruções enviadas para ' + email);
    } else if (email) {
        alert('Por favor, digite um email válido.');
    }
};

window.mostrarTermos = function() {
    const modal = document.getElementById('mdlBg');
    const box = document.getElementById('mdlBox');
    const termos = document.getElementById('termosHtml');
    if (modal && box && termos) {
        box.innerHTML = termos.innerHTML;
        modal.style.display = 'flex';
    }
};

window.closeMdl = function() {
    const modal = document.getElementById('mdlBg');
    if (modal) modal.style.display = 'none';
};

// ============================================================
// LOGIN - Usando handleLogin do auth.js
// ============================================================
frmLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = lEmail.value.trim();
    const password = lPass.value.trim();
    
    console.log('🔐 Tentando login:', email);
    
    if (!email || !password) {
        alert('Preencha todos os campos.');
        return;
    }
    
    const btn = frmLogin.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
    btn.disabled = true;
    
    try {
        const result = await handleLogin(email, password);
        console.log('📥 Resultado do login:', result);
        
        if (result.success) {
            console.log('✅ Login OK! Redirecionando...');
            alert('Login realizado com sucesso!');
            window.location.replace('/index.html');
        } else {
            alert(result.error || 'Erro ao fazer login.');
        }
    } catch (err) {
        console.error('❌ Erro no login:', err);
        alert('Erro ao fazer login. Tente novamente.');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
});

// ============================================================
// CADASTRO - Usando handleCadastro do auth.js
// ============================================================
frmCadastro.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const nome = cNome.value.trim();
    const email = cEmail.value.trim();
    const password = cPass.value;
    const password2 = cPass2.value;
    const termos = cTermos.checked;
    
    console.log('📝 Tentando cadastro:', email);
    
    if (!nome || !email || !password || !password2) {
        alert('Preencha todos os campos.');
        return;
    }
    
    if (password.length < 6) {
        alert('A senha deve ter no mínimo 6 caracteres.');
        return;
    }
    
    if (password !== password2) {
        alert('As senhas não coincidem.');
        return;
    }
    
    if (!termos) {
        alert('Você precisa aceitar os termos de uso.');
        return;
    }
    
    const btn = frmCadastro.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando conta...';
    btn.disabled = true;
    
    try {
        const result = await handleCadastro(email, password, nome);
        console.log('📥 Resultado cadastro:', result);
        
        if (result.success) {
            alert('✅ Cadastro realizado! Verifique seu email para confirmar.');
            window.showT('tLogin');
            lEmail.value = email;
            frmCadastro.reset();
        } else {
            alert(result.error || 'Erro ao criar conta.');
        }
    } catch (err) {
        console.error('❌ Erro no cadastro:', err);
        alert('Erro ao criar conta. Tente novamente.');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
});

// ============================================================
// VERIFICA SE JÁ ESTÁ LOGADO (redireciona se sim)
// ============================================================
try {
    const auth = await checkAuth();
    if (auth.isAuthenticated) {
        console.log('✅ Usuário já logado, redirecionando...');
        window.location.replace('/index.html');
    }
} catch (err) {
    console.warn('Erro ao verificar sessão:', err);
}

console.log('✅ Login page pronta!');
</script>
