<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SulSafe - Gestão de Segurança do Trabalho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #f3f4f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .layout-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .area-topo-direita {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .btn-acessar {
      display: inline-block;
      background-color: #2E7D32;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: none;
      cursor: pointer;
    }

    .btn-acessar:hover {
      background-color: #1b5e20;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(46, 125, 50, 0.3);
    }

    .logo-principal {
      max-width: 95%;
      max-height: 95vh;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .area-topo-direita {
        top: 16px;
        right: 16px;
      }
      .btn-acessar {
        padding: 9px 18px;
        font-size: 13px;
      }
      .logo-principal {
        max-width: 100%;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout-container">
    <div class="area-topo-direita">
      <a href="login.html" class="btn-acessar">Acessar a Plataforma</a>
    </div>
    
    <img src="sulsafe.png" alt="SulSafe Segurança do Trabalho" class="logo-principal">
  </div>
</body>
</html>
