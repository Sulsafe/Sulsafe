    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ============ RESET & BASE ============ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --verde: #2E7D32;
            --verde-escuro: #1B5E20;
            --verde-claro: #43A047;
            --verde-bg: #E8F5E9;
            --verde-bg-2: #F1F8F1;
            --dourado: #C9B037;
            --dourado-escuro: #A8922C;
            --dourado-claro: #E8D77A;
            --texto: #1A1A1A;
            --texto-sec: #555;
            --texto-ter: #777;
            --borda: #E0E0E0;
            --borda-2: #EEE;
            --branco: #FFFFFF;
            --preto: #0E0E0E;
            --sombra: 0 4px 16px rgba(0,0,0,.06);
            --sombra-md: 0 12px 28px rgba(0,0,0,.10);
            --sombra-lg: 0 24px 48px rgba(0,0,0,.12);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --grad-verde: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            --grad-dourado: linear-gradient(135deg, #E8D77A 0%, #C9B037 100%);
            --max: 1200px;
        }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--texto);
            background: var(--branco);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Montserrat', 'Inter', sans-serif; }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        ::selection { background: var(--verde); color: #fff; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--verde-bg-2); }
        ::-webkit-scrollbar-thumb { background: var(--verde); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--verde-escuro); }

        /* ============ LAYOUT HELPERS ============ */
        .container { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 24px; }
        .section { padding: 96px 0; position: relative; }
        .section-sm { padding: 64px 0; }
        .text-center { text-align: center; }
        .gradient-text {
            background: var(--grad-verde);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--verde-bg);
            color: var(--verde-escuro);
            font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 8px 16px; border-radius: 100px;
            border: 1px solid rgba(46,125,50,.2);
            margin-bottom: 18px;
        }
        .eyebrow i { color: var(--dourado); }
        .section-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 800; line-height: 1.15;
            letter-spacing: -.5px;
            margin-bottom: 16px;
        }
        .section-subtitle {
            font-size: 17px; color: var(--texto-sec);
            max-width: 640px; margin: 0 auto;
            line-height: 1.7;
        }
        .section-head { text-align: center; margin-bottom: 56px; }

        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px; font-weight: 700;
            padding: 14px 28px;
            border-radius: 100px;
            transition: all .25s cubic-bezier(.2,.9,.4,1.1);
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            border: 2px solid transparent;
            line-height: 1;
        }
        .btn-primary {
            background: var(--grad-verde);
            color: #fff;
            box-shadow: 0 6px 20px rgba(46,125,50,.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(46,125,50,.45);
        }
        .btn-gold {
            background: var(--grad-dourado);
            color: var(--verde-escuro);
            box-shadow: 0 6px 20px rgba(201,176,55,.35);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(201,176,55,.45); }
        .btn-outline {
            background: transparent;
            color: var(--verde-escuro);
            border: 2px solid var(--verde);
        }
        .btn-outline:hover { background: var(--verde); color: #fff; transform: translateY(-2px); }
        .btn-block { width: 100%; }
        .btn-lg { padding: 17px 36px; font-size: 16px; }

        /* ============ HEADER ============ */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(224,224,224,.6);
            transition: background-color .3s ease, box-shadow .3s ease;
            will-change: background-color, box-shadow;
            transform: translateZ(0);
        }
        .header.scrolled {
            background: rgba(255,255,255,.97);
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 72px;
            max-width: var(--max); margin: 0 auto;
            padding: 0 24px;
        }
        .logo-link { display: flex; align-items: center; gap: 12px; }
        .logo-mark {
            width: 42px; height: 42px;
            background: var(--grad-verde);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(46,125,50,.3);
            overflow: hidden;
        }
        .logo-mark img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text-wrap { display: flex; flex-direction: column; line-height: 1; }
        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px; font-weight: 800;
            color: var(--verde-escuro);
            letter-spacing: -.5px;
        }
        .logo-sub {
            font-size: 9px; font-weight: 600;
            color: var(--dourado-escuro);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .nav { display: flex; align-items: center; gap: 4px; }
        .nav a {
            font-size: 14.5px; font-weight: 600;
            color: var(--texto-sec);
            padding: 8px 14px; border-radius: 100px;
            transition: all .2s;
        }
        .nav a:hover { color: var(--verde-escuro); background: var(--verde-bg); }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .header-actions .btn { padding: 10px 22px; font-size: 14px; }

        .hamburger {
            display: none; width: 44px; height: 44px;
            border-radius: 12px; background: var(--verde-bg);
            align-items: center; justify-content: center;
            color: var(--verde-escuro); font-size: 20px;
        }
        .mobile-nav {
            position: fixed; top: 72px; left: 0; right: 0;
            background: #fff; padding: 16px;
            border-bottom: 1px solid var(--borda);
            box-shadow: var(--sombra-md);
            transform: translateY(-120%);
            transition: transform .3s;
            z-index: 999;
            max-height: calc(100vh - 72px);
            overflow-y: auto;
        }
        .mobile-nav.open { transform: translateY(0); }
        .mobile-nav a {
            display: block; padding: 14px 16px;
            font-size: 16px; font-weight: 600;
            color: var(--texto);
            border-radius: 12px;
            margin-bottom: 4px;
        }
        .mobile-nav a:hover { background: var(--verde-bg); color: var(--verde-escuro); }
        .mobile-nav .btn { width: 100%; margin-top: 8px; }

        /* ============ HERO ============ */
        .hero {
            position: relative;
            padding: 140px 0 80px;
            background: radial-gradient(ellipse at top right, var(--verde-bg) 0%, transparent 60%),
                        radial-gradient(ellipse at bottom left, rgba(201,176,55,.08) 0%, transparent 50%),
                        linear-gradient(180deg, #fff 0%, var(--verde-bg-2) 100%);
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute; top: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(46,125,50,.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute; bottom: -100px; left: -150px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(201,176,55,.18), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            gap: 56px;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .hero-content { max-width: 600px; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 10px;
            background: #fff;
            color: var(--verde-escuro);
            font-size: 13px; font-weight: 700;
            padding: 8px 16px; border-radius: 100px;
            border: 1px solid var(--borda);
            box-shadow: var(--sombra);
            margin-bottom: 24px;
        }
        .hero-badge .dot {
            width: 8px; height: 8px;
            background: var(--verde-claro);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(67,160,71,.2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(67,160,71,.2); }
            50% { box-shadow: 0 0 0 8px rgba(67,160,71,0); }
        }
        .hero h1 {
            font-size: clamp(34px, 5vw, 60px);
            font-weight: 900; line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
        }
        .hero h1 .highlight {
            position: relative;
            display: inline-block;
            background: var(--grad-verde);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-tagline {
            font-size: 19px; color: var(--texto-sec);
            margin-bottom: 32px; line-height: 1.6;
            font-weight: 500;
        }
        .hero-tagline strong { color: var(--verde-escuro); font-weight: 700; }
        .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
        .hero-mini {
            display: flex; gap: 24px; flex-wrap: wrap;
            padding-top: 28px;
            border-top: 1px solid var(--borda);
        }
        .hero-mini-item {
            display: flex; align-items: center; gap: 10px;
            font-size: 13.5px; color: var(--texto-sec); font-weight: 500;
        }
        .hero-mini-item i {
            color: var(--verde); font-size: 16px;
            width: 32px; height: 32px;
            background: var(--verde-bg);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .hero-visual {
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .hero-logo-wrap {
            position: relative;
            background: #fff;
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--sombra-lg);
            border: 1px solid var(--borda-2);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .hero-logo-wrap, .hero-badge .dot {
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .hero-logo-wrap img {
            width: 100%; max-width: 420px;
            height: auto;
        }
        .hero-logo-wrap::before {
            content: '';
            position: absolute; inset: -3px;
            background: var(--grad-verde);
            border-radius: 32px;
            z-index: -1;
            opacity: .15;
            filter: blur(20px);
        }

        /* ============ TRUST BAR ============ */
        .trust-bar {
            background: var(--grad-verde);
            color: #fff;
            padding: 16px 0;
            overflow: hidden;
        }
        .trust-track {
            display: flex; align-items: center; justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            font-size: 14px; font-weight: 600;
        }
        .trust-track span {
            display: inline-flex; align-items: center; gap: 10px;
            white-space: nowrap;
        }
        .trust-track i { color: var(--dourado-claro); font-size: 16px; }
        .trust-track .sep {
            width: 4px; height: 4px;
            background: rgba(255,255,255,.4);
            border-radius: 50%;
        }

        /* ============ FEATURES (Por que SulSafe) ============ */
        .features { background: #fff; }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .feature-card {
            background: #fff;
            border: 1px solid var(--borda-2);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            transition: all .3s cubic-bezier(.2,.9,.4,1.1);
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--grad-verde);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .35s;
        }
        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--sombra-lg);
            border-color: transparent;
        }
        .feature-card:hover::before { transform: scaleX(1); }
        .feature-ic {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: var(--verde-bg);
            color: var(--verde-escuro);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            margin-bottom: 20px;
            transition: all .3s;
        }
        .feature-card:hover .feature-ic {
            background: var(--grad-verde);
            color: #fff;
            transform: rotate(-6deg) scale(1.05);
        }
        .feature-card h3 {
            font-size: 19px; font-weight: 700;
            margin-bottom: 10px;
            color: var(--texto);
        }
        .feature-card p {
            font-size: 14.5px; color: var(--texto-sec);
            line-height: 1.65;
        }

        /* ============ NR CATÁLOGO ============ */
        .nrs {
            background: linear-gradient(180deg, var(--verde-bg-2) 0%, #fff 100%);
        }
        .nr-filters {
            display: flex; gap: 10px; justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .nr-filter {
            padding: 10px 22px;
            border-radius: 100px;
            font-size: 14px; font-weight: 700;
            background: #fff;
            color: var(--texto-sec);
            border: 1.5px solid var(--borda);
            transition: all .2s;
        }
        .nr-filter:hover { border-color: var(--verde); color: var(--verde-escuro); }
        .nr-filter.active {
            background: var(--grad-verde);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(46,125,50,.3);
        }
        .nr-filter .count {
            font-size: 12px; font-weight: 600;
            opacity: .7;
            margin-left: 4px;
        }
        .nr-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .nr-card {
            background: #fff;
            border: 1px solid var(--borda-2);
            border-radius: var(--radius);
            padding: 20px 18px;
            display: flex; align-items: center; gap: 14px;
            transition: all .25s;
            cursor: pointer;
        }
        .nr-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-md);
            border-color: var(--verde);
        }
        .nr-emoji {
            width: 50px; height: 50px;
            border-radius: 12px;
            background: var(--verde-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            transition: all .25s;
        }
        .nr-card:hover .nr-emoji {
            background: var(--grad-verde);
            transform: scale(1.05);
        }
        .nr-info { min-width: 0; }
        .nr-num {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px; font-weight: 800;
            color: var(--dourado-escuro);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .nr-name {
            font-size: 13.5px; font-weight: 600;
            color: var(--texto);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .nr-card.hidden { display: none; }

        /* ============ COMO FUNCIONA ============ */
        .how { background: #fff; }
        .how-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            position: relative;
        }
        .how-grid::before {
            content: '';
            position: absolute;
            top: 50px; left: 16.6%; right: 16.6%;
            height: 2px;
            background: linear-gradient(90deg, var(--verde-bg), var(--verde), var(--verde-bg));
            z-index: 0;
        }
        .how-step {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .how-num {
            width: 100px; height: 100px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--verde-bg);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 36px; font-weight: 900;
            background: var(--grad-verde);
            color: #fff;
            box-shadow: 0 10px 24px rgba(46,125,50,.3);
            position: relative;
        }
        .how-num::after {
            content: '';
            position: absolute; inset: -8px;
            border: 2px dashed rgba(46,125,50,.25);
            border-radius: 50%;
        }
        .how-step h3 {
            font-size: 20px; font-weight: 700;
            margin-bottom: 10px;
        }
        .how-step p {
            font-size: 15px; color: var(--texto-sec);
            line-height: 1.65;
            max-width: 300px; margin: 0 auto;
        }
        .how-step .step-ic {
            font-size: 22px;
            color: var(--dourado);
            margin-bottom: 8px;
            display: block;
        }

        /* ============ PLANOS ============ */
        .planos {
            background: linear-gradient(180deg, var(--verde-bg-2) 0%, #fff 100%);
        }
        .planos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            align-items: stretch;
            margin-top: 8px;
        }
        .plano {
            background: #fff;
            border: 1.5px solid var(--borda);
            border-radius: var(--radius-lg);
            padding: 36px 28px;
            display: flex; flex-direction: column;
            transition: all .3s;
            position: relative;
        }
        .plano:hover {
            transform: translateY(-6px);
            box-shadow: var(--sombra-lg);
        }
        .plano.popular {
            border: 2px solid var(--verde);
            box-shadow: 0 18px 40px rgba(46,125,50,.18);
            transform: scale(1.04);
        }
        .plano.popular:hover { transform: scale(1.04) translateY(-6px); }
        .plano-badge {
            position: absolute; top: -14px; left: 50%;
            transform: translateX(-50%);
            background: var(--grad-dourado);
            color: var(--verde-escuro);
            font-size: 11px; font-weight: 800;
            letter-spacing: 1.5px; text-transform: uppercase;
            padding: 7px 18px;
            border-radius: 100px;
            box-shadow: 0 4px 14px rgba(201,176,55,.4);
            white-space: nowrap;
        }
        .plano-ic {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: var(--verde-bg);
            color: var(--verde-escuro);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            margin-bottom: 18px;
        }
        .plano.popular .plano-ic { background: var(--grad-verde); color: #fff; }
        .plano h3 {
            font-size: 22px; font-weight: 800;
            margin-bottom: 6px;
        }
        .plano-desc {
            font-size: 13.5px; color: var(--texto-ter);
            margin-bottom: 20px;
        }
        .plano-preco {
            display: flex; align-items: baseline; gap: 6px;
            margin-bottom: 4px;
        }
        .plano-preco .cifra { font-size: 22px; font-weight: 600; color: var(--texto-sec); }
        .plano-preco .valor {
            font-family: 'Montserrat', sans-serif;
            font-size: 44px; font-weight: 900;
            color: var(--texto);
            letter-spacing: -1px;
        }
        .plano-preco .centavos { font-size: 18px; font-weight: 700; color: var(--texto); }
        .plano-ciclo {
            font-size: 13px; color: var(--texto-ter);
            margin-bottom: 24px;
            font-weight: 500;
        }
        .plano-eq {
            font-size: 12px; color: var(--verde-escuro);
            background: var(--verde-bg);
            padding: 6px 12px;
            border-radius: 100px;
            display: inline-block;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .plano-features {
            flex: 1;
            display: flex; flex-direction: column; gap: 12px;
            margin-bottom: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--borda-2);
        }
        .plano-features li {
            display: flex; align-items: flex-start; gap: 10px;
            font-size: 14px; color: var(--texto);
            line-height: 1.4;
        }
        .plano-features li i {
            color: var(--verde);
            font-size: 13px;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .plano-features li.off { color: var(--texto-ter); }
        .plano-features li.off i { color: var(--borda); }
        .plano .btn { width: 100%; }

        /* ============ FAQ ============ */
        .faq { background: var(--verde-bg-2); }
        .faq-list {
            max-width: 820px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        .faq-item {
            background: #fff;
            border: 1px solid var(--borda-2);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all .25s;
        }
        .faq-item:hover { box-shadow: var(--sombra); border-color: var(--borda); }
        .faq-item.open { box-shadow: var(--sombra-md); border-color: var(--verde); }
        .faq-q {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            text-align: left;
            font-size: 16px; font-weight: 600;
            color: var(--texto);
            transition: color .2s;
        }
        .faq-q:hover { color: var(--verde-escuro); }
        .faq-q .ic {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--verde-bg);
            color: var(--verde-escuro);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all .25s;
        }
        .faq-item.open .faq-q .ic {
            background: var(--grad-verde);
            color: #fff;
            transform: rotate(180deg);
        }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
        }
        .faq-a-inner {
            padding: 0 24px 22px 24px;
            font-size: 14.5px;
            color: var(--texto-sec);
            line-height: 1.7;
        }

        /* ============ SEÇÃO DE IMAGENS ============ */
        .imagens-section {
            background: var(--verde-bg-2);
            padding: 60px 0;
        }
        .imagens-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            align-items: center;
            justify-items: center;
        }
        .imagem-item {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .3s ease;
        }
        .imagem-item:hover {
            transform: scale(1.05);
        }
        .imagem-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,.1));
        }

        /* ============ CTA FINAL ============ */
        .cta-final {
            background: var(--grad-verde);
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .cta-final::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 15% 30%, rgba(201,176,55,.25), transparent 35%),
                radial-gradient(circle at 85% 70%, rgba(255,255,255,.1), transparent 40%);
        }
        .cta-final .container { position: relative; z-index: 1; }
