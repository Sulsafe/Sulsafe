<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SulSafe - Gestão de Segurança do Trabalho</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
    }
    .logo-principal {
      width: 100%;
      max-width: 350px;
      height: auto;
      margin-bottom: 35px;
    }
    .btn-acessar {
      display: inline-block;
      background-color: #2E7D32; /* Verde oficial da SulSafe */
      color: #ffffff;
      text-decoration: none;
      padding: 16px 45px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
      border: none;
      cursor: pointer;
    }
    .btn-acessar:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Chama a foto da logo que acabou de subir -->
    <img src="sulsafe.png" alt="SulSafe Segurança do Trabalho" class="logo-principal">
    
    <!-- Botão verde direto para o arquivo de login -->
    <div>
      <a href="login.html" class="btn-acessar">Acessar a Plataforma</a>
    </div>
  </div>

</body>
</html>
