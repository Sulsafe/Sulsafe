<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SulSafe - Gestão de Segurança do Trabalho</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* A mágica acontece aqui: a imagem vira o fundo completo da tela */
    .tela-bg {
      background-image: url('sulsafe.png');
      background-size: cover; /* Força a imagem a preencher toda a tela */
      background-position: center center; /* Mantém o centro da logo focado */
      background-repeat: no-repeat;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Empurra o botão totalmente para a base */
      align-items: center;
      box-sizing: border-box;
      padding-bottom: 60px; /* Distância do botão até o final da tela */
    }

    .area-botao {
      width: 90%;
      max-width: 325px;
    }

    .btn-acessar {
      display: block;
      background-color: #2E7D32;
      color: #ffffff;
      text-decoration: none;
      padding: 18px 20px;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      border: none;
      cursor: pointer;
    }

    .btn-acessar:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(46, 125, 50, 0.5);
    }
  </style>
</head>
<body>

  <!-- O container agora carrega a imagem como fundo total -->
  <div class="tela-bg">
    <div class="area-botao">
      <a href="login.html" class="btn-acessar">Acessar a Plataforma</a>
    </div>
  </div>

</body>
</html>
